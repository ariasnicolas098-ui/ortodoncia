<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio Dental - Búsqueda Inteligente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .admin-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .admin-btn:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 1.1em; }

        .search-section {
            padding: 40px;
            background: #f8f9fa;
        }

        .search-box {
            display: flex;
            gap: 15px;
            max-width: 700px;
            margin: 0 auto;
            flex-wrap: wrap;
            position: relative;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            min-width: 250px;
        }

        #searchInput {
            width: 100%;
            padding: 18px 25px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s;
        }

        #searchInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .mic-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #f44336;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }

        .mic-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.6);
        }

        .mic-btn.listening {
            background: #4CAF50;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4); }
            50% { transform: scale(1.1); box-shadow: 0 6px 25px rgba(76, 175, 80, 0.6); }
        }

        .search-btn {
            padding: 18px 35px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #5a6fd6;
            transform: translateY(-2px);
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
            min-height: 20px;
        }

        /* Lista de resultados de búsqueda */
        .search-results-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .search-results-list.active {
            display: block;
        }

        .search-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-result-item:hover {
            background: #f5f7fa;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .result-info {
            flex: 1;
        }

        .result-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .result-details {
            font-size: 13px;
            color: #666;
            margin-top: 3px;
        }

        .btn-ver {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-ver:hover {
            background: #5a6fd6;
            transform: scale(1.05);
        }

        .results-section {
            padding: 40px;
            min-height: 400px;
        }

        .no-results {
            text-align: center;
            padding: 50px;
            color: #999;
            font-size: 1.1em;
        }

        /* Tarjeta de paciente detallada */
        .patient-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border-left: 5px solid #667eea;
        }

        .patient-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .patient-title h2 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .patient-id {
            color: #999;
            font-size: 14px;
        }

        .patient-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        /* Sección de archivos */
        .archivos-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .archivos-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .file-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .file-item:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .file-icon {
            font-size: 2.5em;
            margin-bottom: 8px;
        }

        .file-name {
            font-size: 12px;
            color: #333;
            word-break: break-word;
            line-height: 1.3;
        }

        .no-files {
            text-align: center;
            padding: 30px;
            color: #999;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 768px) {
            .search-box { flex-direction: column; }
            .mic-btn, .search-btn { width: 100%; }
            .admin-btn { position: static; display: inline-block; margin-top: 15px; }
            .header { padding-top: 20px; }
        }
        /* Estilos para citas en el buscador */
.cita-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    background: #f8f9fa;
    border-radius: 8px;
    margin-bottom: 8px;
    border-left: 4px solid #667eea;
    transition: all 0.3s;
}

.cita-item:hover {
    background: #e3f2fd;
    transform: translateX(5px);
}

.cita-fecha {
    font-weight: 600;
    color: #333;
}

.cita-hora {
    font-size: 13px;
    color: #666;
}

.cita-estado {
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
}

/* Estilos para abonos en el buscador */
.abono-buscador {
    padding: 15px;
    background: #f8f9fa;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 2px solid transparent;
    transition: all 0.3s;
}

.abono-buscador:hover {
    border-color: #667eea;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
}

.abono-barra {
    width: 100%;
    height: 8px;
    background: #e0e0e0;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 8px;
}

.abono-progreso {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
}

/* Resumen financiero */
.resumen-financiero {
    margin-top: 20px;
    padding: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 12px;
    color: white;
}

.resumen-item {
    text-align: center;
}

.resumen-label {
    font-size: 12px;
    opacity: 0.9;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.resumen-valor {
    font-size: 1.5em;
    font-weight: bold;
    margin-top: 5px;
}
        /* Visor de archivos integrado */
.viewer-container {
    margin-top: 25px;
    padding: 20px;
    background: #f8f9fa;
    border: 2px dashed #667eea;
    border-radius: 12px;
    display: none; /* Oculto por defecto */
    animation: fadeIn 0.3s;
}
.viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
}
.viewer-title { font-weight: bold; color: #333; }
.viewer-close {
    background: #f44336;
    color: white;
    border: none;
    padding: 5px 15px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9em;
}
.viewer-content img {
    max-width: 100%;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
/* Optimización: las imágenes cargan solo cuando se ven */
.file-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="https://ortodoncia-production.up.railway.app/admin" class="admin-btn">⚙️ Administrador</a>
            <h1>🏥 Consultorio Dental</h1>
            <p>Búsqueda de pacientes por voz o texto</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <div class="input-wrapper">
                    <input type="text" id="searchInput" placeholder="Diga o escriba el nombre del paciente..." autocomplete="off">
                    <!-- Lista de resultados flotante -->
                    <div id="searchResults" class="search-results-list"></div>
                </div>
                <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Buscar por voz">🎤</button>
                <button class="search-btn" onclick="buscarPaciente()">Buscar</button>
            </div>
            <div class="status" id="status"></div>
        </div>

        <div class="results-section" id="resultados">
            <div class="no-results">
                🔍 Ingrese un nombre para buscar el historial del paciente
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://ortodoncia-production.up.railway.app";
        let recognition;
        let pacienteActual = null;

        // 1. Formato de dinero con separadores de miles
function formatMoney(amount) {
    if (amount === null || amount === undefined) return '$0.00';
    return '$' + parseFloat(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// 2. Formato de fecha
function formatDate(dateStr) {
    if (!dateStr) return '-';
    return new Date(dateStr).toLocaleDateString('es-ES');
}

// 3. Función para mostrar archivos DENTRO de la página (Visor)
function mostrarVisor(url, tipo, nombre) {
    const container = document.getElementById('viewer-container');
    const content = document.getElementById('viewer-content');
    const title = document.getElementById('viewer-title');
    
    title.textContent = nombre;
    content.innerHTML = ''; // Limpiar

    if (tipo === 'radiografia' || tipo === 'foto' || url.match(/\.(jpg|jpeg|png|gif)$/i)) {
        content.innerHTML = `<img src="${url}" alt="${nombre}" style="max-width:100%; border-radius:8px;">`;
    } else if (tipo === 'pdf' || url.match(/\.pdf$/i)) {
        content.innerHTML = `<embed src="${url}" type="application/pdf" width="100%" height="500px" />`;
    } else {
        content.innerHTML = `
            <div style="text-align:center; padding:20px;">
                <p>Este archivo no se puede previsualizar.</p>
                <a href="${url}" download class="btn" style="background:#667eea; color:white; padding:10px 20px; text-decoration:none; border-radius:5px;">⬇️ Descargar Archivo</a>
            </div>`;
    }
    
    container.style.display = 'block';
    container.scrollIntoView({ behavior: 'smooth' });
}

function cerrarVisor() {
    document.getElementById('viewer-container').style.display = 'none';
    document.getElementById('viewer-content').innerHTML = '';
}
        
        // ========== NUEVO: Precargar datos desde URL al iniciar ==========
        document.addEventListener('DOMContentLoaded', () => {
            // Verificar si venimos del panel de admin con datos precargados
            const urlParams = new URLSearchParams(window.location.search);
            const pacienteId = urlParams.get('paciente_id');
            const nombrePaciente = urlParams.get('nombre');
            
            if (pacienteId && nombrePaciente) {
                // Precargar el nombre en el buscador
                const nombreDecodificado = decodeURIComponent(nombrePaciente);
                document.getElementById('searchInput').value = nombreDecodificado;
                
                // Mostrar estado de carga
                document.getElementById('status').textContent = `Cargando datos de ${nombreDecodificado}...`;
                
                // Buscar automáticamente el paciente después de un pequeño delay
                setTimeout(() => {
                    verPaciente(pacienteId, nombreDecodificado);
                }, 300);
                
                // Limpiar la URL para que quede limpia (opcional)
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            
            // Inicializar reconocimiento de voz
            initVoiceRecognition();
        });
        // ================================================================

        // Inicializar reconocimiento de voz
        function initVoiceRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'es-ES';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('searchInput').value = transcript;
                    document.getElementById('status').textContent = 'Buscando: "' + transcript + '"';
                    buscarPaciente(transcript);
                    document.getElementById('micBtn').classList.remove('listening');
                };

                recognition.onerror = (event) => {
                    console.error('Error de reconocimiento:', event.error);
                    document.getElementById('status').textContent = 'Error al escuchar. Intenta de nuevo.';
                    document.getElementById('micBtn').classList.remove('listening');
                };

                recognition.onend = () => {
                    document.getElementById('micBtn').classList.remove('listening');
                };
            }
        }

        function toggleVoice() {
            if (!recognition) {
                alert('Tu navegador no soporta búsqueda por voz');
                return;
            }

            const micBtn = document.getElementById('micBtn');
            
            if (micBtn.classList.contains('listening')) {
                recognition.stop();
                micBtn.classList.remove('listening');
                document.getElementById('status').textContent = '';
            } else {
                recognition.start();
                micBtn.classList.add('listening');
                document.getElementById('status').textContent = '🎤 Escuchando...';
            }
        }

        // Búsqueda en tiempo real mientras escribe
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length >= 2) {
                buscarPacientesLista(query);
            } else {
                document.getElementById('searchResults').classList.remove('active');
            }
        });

        // Cerrar lista al hacer clic fuera
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.input-wrapper')) {
                document.getElementById('searchResults').classList.remove('active');
            }
        });

        async function buscarPacientesLista(query) {
            try {
                const response = await fetch(`${API_URL}/api/buscar?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                mostrarListaResultados(data);
            } catch (error) {
                console.error('Error buscando:', error);
            }
        }

        function mostrarListaResultados(pacientes) {
            const lista = document.getElementById('searchResults');
            
            if (pacientes.length === 0) {
                lista.innerHTML = '<div class="search-result-item"><div class="result-info"><div class="result-name">No se encontraron pacientes</div></div></div>';
                lista.classList.add('active');
                return;
            }

            lista.innerHTML = pacientes.map(p => `
                <div class="search-result-item">
                    <div class="result-info">
                        <div class="result-name">${p.nombre_completo}</div>
                        <div class="result-details">${p.dni ? 'DNI: ' + p.dni : 'Sin DNI'} | ${p.telefono || 'Sin teléfono'}</div>
                    </div>
                    <button class="btn-ver" onclick="verPaciente(${p.id}, '${p.nombre_completo.replace(/'/g, "\\'")}')">Ver</button>
                </div>
            `).join('');
            
            lista.classList.add('active');
        }

async function verPaciente(id, nombre) {
    document.getElementById('searchResults').classList.remove('active');
    document.getElementById('searchInput').value = nombre;
    
    const resultados = document.getElementById('resultados');
    resultados.innerHTML = `<div class="loading"><div class="spinner"></div><p>Cargando información del paciente...</p></div>`;

    try {
        // CAMBIO IMPORTANTE: Hacemos UNA sola petición al backend unificado
        const res = await fetch(`${API_URL}/api/pacientes/${id}`);
        
        if (!res.ok) {
            throw new Error("Error al cargar datos");
        }
        
        const paciente = await res.json();
        
        // Pasamos los datos directamente a la función de mostrar
        // Ya no hacemos fetch separados para archivos, citas o abonos
        mostrarDetallePaciente(paciente, paciente.archivos || [], paciente.citas || [], paciente.abonos || []);
        
    } catch (error) {
        console.error(error);
        resultados.innerHTML = `<div class="no-results" style="color: red;">❌ Error al cargar los datos del paciente.<br>Detalles: ${error.message}</div>`;
    }
}

function mostrarDetallePaciente(paciente, archivos, citas = [], abonos = []) {
    pacienteActual = paciente;
    
    // 1. Definir el HTML del visor de archivos (se mostrará al hacer clic)
    const viewerHtml = `
        <div id="viewer-container" class="viewer-container" style="display:none; margin-top:20px; padding:20px; background:#f0f2f5; border-radius:12px; border:2px solid #667eea;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h4 id="viewer-title" style="margin:0; color:#333;">Archivo</h4>
                <button onclick="cerrarVisor()" style="background:#f44336; color:white; border:none; padding:5px 15px; border-radius:20px; cursor:pointer;">✖ Cerrar</button>
            </div>
            <div id="viewer-content"></div>
        </div>
    `;

    // 2. Generar HTML de Archivos
    let archivosHtml = '';
    if (archivos.length === 0) {
        archivosHtml = '<div class="no-files">Este paciente no tiene archivos adjuntos</div>';
    } else {
        archivosHtml = `
            <div class="files-grid">
                ${archivos.map(a => {
                    const iconos = { 'radiografia': '🩻', 'foto': '📷', 'documento': '📄', 'pdf': '📑' };
                    const icon = iconos[a.tipo] || '📎';
                    return `
                        <div class="file-item" onclick="mostrarVisor('${a.url}', '${a.tipo}', '${a.nombre}')">
                            <div class="file-icon">${icon}</div>
                            <div class="file-name">${a.descripcion || a.nombre}</div>
                        </div>
                    `;
                }).join('')}
            </div>
            ${viewerHtml}
        `;
    }

    // 3. Generar HTML de Citas
    let citasHtml = '';
    if (citas.length === 0) {
        citasHtml = '<p style="color:#999; text-align:center; padding:20px;">No tiene citas registradas</p>';
    } else {
        citasHtml = `
            <div style="display:flex; flex-direction:column; gap:10px;">
                ${citas.map(c => {
                    const fecha = new Date(c.fecha).toLocaleDateString('es-ES');
                    const estadoColor = c.estado === 'programada' ? '#4CAF50' : c.estado === 'completada' ? '#2196F3' : '#f44336';
                    const estadoIcono = c.estado === 'programada' ? '📅' : c.estado === 'completada' ? '✅' : '❌';
                    return `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 15px; background:#f8f9fa; border-radius:8px; border-left:4px solid ${estadoColor};">
                            <div>
                                <div style="font-weight:600; color:#333;">${estadoIcono} ${fecha} - ${c.hora || 'Sin hora'}</div>
                                <div style="font-size:13px; color:#666;">${c.motivo || 'Consulta general'}</div>
                            </div>
                            <span style="padding:4px 12px; border-radius:12px; font-size:12px; background:${estadoColor}20; color:${estadoColor}; text-transform:uppercase;">${c.estado}</span>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    // 4. Generar HTML de Abonos (Con separadores de miles)
    let totalDeuda = 0;
    let totalAbonado = 0;
    
    let abonosHtml = '';
    if (abonos.length === 0) {
        abonosHtml = '<p style="color:#999; text-align:center; padding:20px;">No tiene abonos registrados</p>';
    } else {
        abonosHtml = `
            <div style="display:flex; flex-direction:column; gap:12px;">
                ${abonos.map(a => {
                    totalDeuda += parseFloat(a.precio_total);
                    totalAbonado += parseFloat(a.total_abonado);
                    const saldo = parseFloat(a.precio_total) - parseFloat(a.total_abonado);
                    const porcentaje = a.precio_total > 0 ? (a.total_abonado / a.precio_total * 100) : 0;
                    const estadoColor = a.estado === 'pagado' ? '#4CAF50' : a.estado === 'abonado' ? '#FF9800' : '#f44336';
                    
                    return `
                        <div style="padding:15px; background:#f8f9fa; border-radius:10px; border-left:4px solid ${estadoColor};">
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                                <span style="font-weight:600;">${a.condicion_nombre}</span>
                                <span style="color:${estadoColor}; text-transform:uppercase; font-size:0.8em;">${a.estado}</span>
                            </div>
                            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; font-size:0.9em;">
                                <div>Total: <strong>${formatMoney(a.precio_total)}</strong></div>
                                <div>Abonado: <strong style="color:#4CAF50;">${formatMoney(a.total_abonado)}</strong></div>
                                <div>Saldo: <strong style="color:${saldo > 0 ? '#f44336' : '#333'};">${formatMoney(saldo)}</strong></div>
                            </div>
                            <div style="margin-top:8px; height:6px; background:#e0e0e0; border-radius:3px;">
                                <div style="width:${porcentaje}%; height:100%; background:${estadoColor}; border-radius:3px;"></div>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    // Resumen Financiero
    const saldoPendiente = totalDeuda - totalAbonado;
    const resumenHtml = `
        <div style="margin-top:20px; padding:15px; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius:12px; color:white; display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; text-align:center;">
            <div>
                <div style="font-size:0.8em; opacity:0.9;">Total Deuda</div>
                <div style="font-size:1.2em; font-weight:bold;">${formatMoney(totalDeuda)}</div>
            </div>
            <div>
                <div style="font-size:0.8em; opacity:0.9;">Total Abonado</div>
                <div style="font-size:1.2em; font-weight:bold;">${formatMoney(totalAbonado)}</div>
            </div>
            <div>
                <div style="font-size:0.8em; opacity:0.9;">Saldo Pendiente</div>
                <div style="font-size:1.2em; font-weight:bold; color:${saldoPendiente > 0 ? '#FFD700' : '#90EE90'};">${formatMoney(saldoPendiente)}</div>
            </div>
        </div>
    `;

    // 5. Renderizar TODO en la página
    document.getElementById('resultados').innerHTML = `
        <div class="patient-card">
            <div class="patient-header">
                <div class="patient-title">
                    <h2>${paciente.nombre_completo}</h2>
                    <div class="patient-id">ID: ${paciente.id} | Registrado: ${formatDate(paciente.fecha_registro)}</div>
                </div>
            </div>
            
            <!-- DATOS COMPLETOS DEL PACIENTE -->
            <div class="patient-grid">
                <div class="info-item">
                    <div class="info-label">DNI / Documento</div>
                    <div class="info-value">${paciente.dni || 'No registrado'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Teléfono</div>
                    <div class="info-value">${paciente.telefono || 'No registrado'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Email</div>
                    <div class="info-value">${paciente.email || 'No registrado'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Fecha de Nacimiento</div>
                    <div class="info-value">${paciente.fecha_nacimiento ? new Date(paciente.fecha_nacimiento).toLocaleDateString('es-ES') : 'No registrada'}</div>
                </div>
                <div class="info-item" style="grid-column: 1 / -1;">
                    <div class="info-label">Dirección</div>
                    <div class="info-value">${paciente.direccion || 'No registrada'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Alergias</div>
                    <div class="info-value">${paciente.alergias || 'Ninguna'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Medicamentos Actuales</div>
                    <div class="info-value">${paciente.medicamentos_actuales || 'Ninguno'}</div>
                </div>
                <div class="info-item" style="grid-column: 1 / -1;">
                    <div class="info-label">Condiciones Médicas</div>
                    <div class="info-value">${paciente.condiciones_medicas || 'Ninguna'}</div>
                </div>
            </div>

            <!-- HISTORIAL DE CONSULTAS (Si tienes datos en 'paciente.historial') -->
            ${paciente.historial && paciente.historial.length > 0 ? `
                <div class="archivos-section">
                    <div class="archivos-title">🦷 Historial de Consultas (${paciente.historial.length})</div>
                    <table class="table" style="width:100%; border-collapse:collapse; margin-top:10px;">
                        <thead>
                            <tr style="background:#f0f0f0;">
                                <th style="padding:10px; text-align:left;">Fecha</th>
                                <th style="padding:10px; text-align:left;">Procedimiento</th>
                                <th style="padding:10px; text-align:left;">Diagnóstico</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${paciente.historial.map(h => `
                                <tr>
                                    <td style="padding:10px; border-bottom:1px solid #eee;">${h.fecha_consulta || '-'}</td>
                                    <td style="padding:10px; border-bottom:1px solid #eee;">${h.procedimiento || '-'}</td>
                                    <td style="padding:10px; border-bottom:1px solid #eee;">${h.diagnostico || '-'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            ` : ''}

            <!-- CITAS -->
            <div class="archivos-section">
                <div class="archivos-title">📅 Citas (${citas.length})</div>
                ${citasHtml}
            </div>

            <!-- ABONOS -->
            <div class="archivos-section">
                <div class="archivos-title">💳 Abonos y Pagos (${abonos.length})</div>
                ${abonosHtml}
                ${resumenHtml}
            </div>

            <!-- ARCHIVOS -->
            <div class="archivos-section">
                <div class="archivos-title">📎 Archivos y Documentos (${archivos.length})</div>
                ${archivosHtml}
            </div>
        </div>
    `;
}

        function verArchivo(url) {
            // Si la URL no empieza con http, le agregamos el dominio base (opcional, por si acaso)
            if (url && !url.startsWith('http')) {
                // Como la URL viene del backend como "/uploads/...", está bien
            }
            window.open(url, '_blank');
        }

        async function buscarPaciente(nombre = null) {
            const query = nombre || document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('searchResults').classList.remove('active');
            
            const resultados = document.getElementById('resultados');
            resultados.innerHTML = `<div class="loading"><div class="spinner"></div><p>Buscando paciente...</p></div>`;

            try {
                const response = await fetch(`${API_URL}/api/buscar?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.length === 1) {
                    // Si hay un solo resultado, mostrarlo directamente
                    verPaciente(data[0].id, data[0].nombre_completo);
                } else if (data.length > 1) {
                    // Si hay varios, mostrar la lista
                    mostrarListaResultados(data);
                    resultados.innerHTML = `<div class="no-results">Se encontraron ${data.length} pacientes. Selecciona uno de la lista superior.</div>`;
                } else {
                    resultados.innerHTML = `<div class="no-results">😕 No se encontraron pacientes con "${query}"</div>`;
                }
            } catch (error) {
                resultados.innerHTML = `<div class="no-results" style="color: red;">❌ Error de conexión. Intenta más tarde.</div>`;
            }
        }

        // Búsqueda con Enter
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarPaciente();
        });
    </script>
</body>
</html>
